<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1; 
            --bg-dark: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column;
            box-sizing: border-box; overflow-x: hidden;
        }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-select {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 10px; font-size: 14px; outline: none;
            cursor: pointer; backdrop-filter: blur(10px); -webkit-appearance: none;
        }
        .lang-select option { background: #1e293b; color: white; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .icon-circle {
            width: 110px; height: 110px; border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 15px; border-radius: 14px; margin-bottom: 18px;
            box-sizing: border-box; outline: none; font-size: 15px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }
        
        .btn {
            width: 100%; background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white; border: none; padding: 16px; border-radius: 14px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4); transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; line-height: 1.4; }
        
        .help-toggle { text-align: center; margin-top: 20px; color: #818cf8; font-size: 14px; cursor: pointer; font-weight: 600; }
        .help-content {
            display: none; margin-top: 15px; background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border); border-radius: 14px; padding: 15px;
            font-size: 13px; line-height: 1.6; color: #cbd5e1;
        }
        .help-content h4 { color: #fff; margin: 15px 0 5px 0; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        .help-content a { color: #fbbf24; text-decoration: underline; font-weight: bold; }
        
        /* Nusxalash tugmalari */
        .copy-btn {
            display: block; width: 100%; background: #000; padding: 12px;
            border-radius: 8px; font-family: monospace; color: #22c55e;
            margin: 10px 0; cursor: pointer; border: 1px solid #22c55e;
            text-align: center; font-size: 14px; font-weight: bold;
            transition: 0.2s; box-sizing: border-box;
        }
        .copy-btn:active { transform: scale(0.98); background: #1e293b; }
        
        /* Ogohlantirish */
        .warning-box {
            background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444;
            padding: 12px; border-radius: 8px; font-size: 13px; color: #fca5a5;
            margin-bottom: 20px; line-height: 1.4;
        }
        
        .footer { text-align: center; margin-top: auto; padding-top: 20px; font-size: 14px; color: var(--text-muted); }
        .footer a { color: #60a5fa; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <div class="warning-box">
            ⚠️ <b>Diqqat:</b> Instagram tomonidan bloklanmaslik uchun bir martada maksimal 1,000 tagacha o'chirish tavsiya etiladi!
        </div>

        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        
        <label id="txt-label-count">Nechta odamni unfollow qilish? (Maksimal: 1,000)</label>
        <input type="number" id="count" min="1" max="1000" value="500">
        
        <button class="btn" onclick="sendData()" id="btn-unfollow">
            🔄 Unfollow Boshlash
        </button>
        <div id="status"></div>

        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        
        <div class="help-content" id="helpContent">
            <div id="help-text"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const termuxLink = '<a href="https://play.google.com/store/apps/details?id=com.termux" target="_blank">Termux</a>';
        const authAppLink = '<a href="https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2" target="_blank">Google Authenticator</a>';
        const currentHost = window.location.origin;

        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Nechta odamni unfollow qilish? (Maksimal: 1,000)",
                btn: "🔄 Unfollow Boshlash",
                helpBtnOpen: "❓ Session ID qanday olinadi?",
                helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 1-qadam: Dasturlarni o'rnatish</h4>
                    <p>Play Market'dan <b>${termuxLink}</b> va <b>${authAppLink}</b> (2FA uchun) yuklab oling.</p>
                    
                    <h4>💻 2-qadam: Termux buyruqlari</h4>
                    <p>Termux'ni ochib, quyidagi buyruqlarni ketma-ket nusxalab, yopishtiring va <b>Enter</b> bosing:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Kodni Yuklash (Copy)</button>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button></p>

                    <h4>🔐 3-qadam: 2FA (Autentifikator)</h4>
                    <p>Dastur ishga tushganda Username va Parolni so'raydi. Parolni kiritib Enter bosgach, u <b>2FA kodini</b> so'raydi. <br>
                    Shu payt <b>Google Authenticator</b> ilovasini oching va Instagram uchun berilgan 6 xonali kodni Termux'ga kiriting.</p>
                    
                    <h4>✅ 4-qadam: Session ID</h4>
                    <p>Hammasi to'g'ri bo'lsa, ekranda juda uzun <b>Session ID</b> chiqadi. Uni to'liq nusxalab, botning eng tepasidagi joyga qo'ying. (Qisqa raqamlar emas, aynan uzun harflar aralashmasi bo'lishi shart!)</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Сколько отписаться? (Максимум: 1,000)",
                btn: "🔄 Начать отписку",
                helpBtnOpen: "❓ Как получить Session ID?",
                helpBtnClose: "❌ Закрыть информацию",
                created: "Создатель:",
                help: `
                    <h4>📱 Шаг 1: Установка</h4>
                    <p>Скачайте <b>${termuxLink}</b> и <b>${authAppLink}</b> из Play Market.</p>
                    
                    <h4>💻 Шаг 2: Команды Termux</h4>
                    <p>Скопируйте и вставьте эти команды по очереди:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Скачать скрипт (Copy)</button>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button></p>

                    <h4>🔐 Шаг 3: 2FA</h4>
                    <p>Введите логин и пароль. Затем программа запросит код <b>2FA</b>. Откройте <b>Google Authenticator</b> и введите 6-значный код для Instagram.</p>
                    
                    <h4>✅ Шаг 4: Session ID</h4>
                    <p>Скопируйте полученный длинный <b>Session ID</b> и вставьте его в бота. (Это не короткие цифры, а длинный набор букв и символов).</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "How many to unfollow? (Max: 1,000)",
                btn: "🔄 Start Unfollow",
                helpBtnOpen: "❓ How to get Session ID?",
                helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 Step 1: Install Apps</h4>
                    <p>Download <b>${termuxLink}</b> and <b>${authAppLink}</b> from Play Market.</p>
                    
                    <h4>💻 Step 2: Termux Commands</h4>
                    <p>Copy and paste these commands one by one:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Download Script (Copy)</button>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button></p>

                    <h4>🔐 Step 3: 2FA Code</h4>
                    <p>Enter your username and password. The script will ask for a <b>2FA code</b>. Open <b>Google Authenticator</b>, find Instagram, and enter the 6-digit code.</p>
                    
                    <h4>✅ Step 4: Session ID</h4>
                    <p>Copy the generated long <b>Session ID</b> and paste it into the bot. (It's not short numbers, it's a long mix of characters).</p>
                `
            }
        };

        let currentLang = 'uz';
        let helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            
            const helpBtn = document.getElementById('helpBtn');
            helpBtn.innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            
            if (helpOpen) {
                content.style.display = 'block';
                btn.innerText = translations[currentLang].helpBtnClose;
            } else {
                content.style.display = 'none';
                btn.innerText = translations[currentLang].helpBtnOpen;
            }
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.showAlert("✅ Nusxalandi! Endi Termux'ga yopishtiring.");
                } else {
                    alert("✅ Nusxalandi!");
                }
                
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Nusxalandi!";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "#fff";
                
                setTimeout(() => { 
                    btn.innerHTML = originalText; 
                    btn.style.backgroundColor = "#000"; 
                    if(originalText.includes("Yuklash") || originalText.includes("Скачать") || originalText.includes("Download")) {
                         btn.style.color = "#60a5fa";
                    } else {
                         btn.style.color = "#22c55e";
                    }
                }, 1500);
            }).catch(err => {
                alert("Xatolik: Matnni nusxalab bo'lmadi.");
            });
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btn-unfollow');

            if (!sessionId || sessionId.length < 20) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Session ID ni to'g'ri kiriting! (Uzun bo'lishi shart)" : "❌ Enter a valid Session ID!";
                return;
            }
            if (count < 1 || count > 1000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Xato! Xavfsizlik uchun maksimal 1,000 ta!" : "❌ Error! Max limit is 1,000 for safety.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Tekshirilmoqda...";
            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = currentLang === 'uz' ? "⏳ Session ID tekshirilmoqda..." : "⏳ Checking Session ID...";

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        count: count 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message + (currentLang === 'uz' ? " (Jarayon orqa fonda davom etadi)" : "");
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ Xatolik: " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Server bilan aloqa yo'q!" : "❌ No connection to server!";
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btn;
                }, 5000);
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
    </html>
