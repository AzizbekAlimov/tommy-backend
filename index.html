<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            appearance: none;
        }
        
        .lang-select option {
            background: #1e293b;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px;
            margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }

        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:active { transform: scale(0.96); }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .help-toggle {
            text-align: center;
            margin-top: 20px;
            color: #818cf8;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .help-content {
            display: none;
            margin-top: 15px;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .help-content h4 {
            color: #fff;
            margin: 15px 0 5px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        
        .help-content a {
            color: #60a5fa;
            text-decoration: underline;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .footer a:active { color: #3b82f6; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        
        <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
        <input type="number" id="count" min="1" max="10000" value="100">
        
        <button class="btn" onclick="sendData()" id="txt-btn-unfollow">
            🔄 Unfollow Boshlash
        </button>
        <div id="status"></div>

        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        
        <div class="help-content" id="helpContent">
            <div id="help-text"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Lemur Browser uchun Play Market havolasi
        const lemurLink = '<a href="https://play.google.com/store/apps/details?id=com.lemurbrowser.exts" target="_blank">Lemur Browser</a>';

        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btn: "🔄 Unfollow Boshlash",
                helpBtnOpen: "❓ Session ID qanday olinadi?",
                helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 1. Android telefon uchun</h4>
                    <p><b>Diqqat:</b> Oddiy Chrome brauzerida bo'lmaydi, Play Market'dan ${lemurLink} yuklab oling!<br>1. Lemur Browser orqali Instagram'ga kiring.<br>2. 4 ta kvadrat belgisini bosib, <b>Extensions</b> ni tanlang.<br>3. <b>Cookie-Editor</b> ni o'rnating va oching.<br>4. <b>sessionid</b> qatorini topib, nusxalab oling.</p>
                    <h4>🍏 2. iOS (iPhone) uchun</h4>
                    <p>iPhone'da buni qilish qiyin. Iltimos, kompyuterdan yoki do'stingizning Android telefonidan foydalanib Session ID oling.</p>
                    <h4>💻 3. Kompyuter uchun</h4>
                    <p>1. Chrome brauzerida Instagram'ga kiring.<br>2. <b>F12</b> tugmasini bosing.<br>3. <b>Application</b> -> <b>Cookies</b> bo'limiga o'ting.<br>4. <b>sessionid</b> qatoridagi uzun matnni nusxalab oling.</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Сколько отписаться? (1 - 10,000)",
                btn: "🔄 Начать отписку",
                helpBtnOpen: "❓ Как получить Session ID?",
                helpBtnClose: "❌ Закрыть информацию",
                created: "Создатель:",
                help: `
                    <h4>📱 1. Для Android</h4>
                    <p><b>Внимание:</b> Обычный Chrome не подойдет, скачайте ${lemurLink} из Play Market!<br>1. Зайдите в Instagram через Lemur Browser.<br>2. Нажмите значок из 4 квадратов и выберите <b>Extensions</b>.<br>3. Установите и откройте <b>Cookie-Editor</b>.<br>4. Скопируйте строку <b>sessionid</b>.</p>
                    <h4>🍏 2. Для iOS (iPhone)</h4>
                    <p>На iPhone это сделать сложно. Пожалуйста, используйте компьютер или Android-телефон друга.</p>
                    <h4>💻 3. Для компьютера</h4>
                    <p>1. Зайдите в Instagram в Chrome.<br>2. Нажмите <b>F12</b>.<br>3. Перейдите в <b>Application</b> -> <b>Cookies</b>.<br>4. Скопируйте значение строки <b>sessionid</b>.</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "How many to unfollow? (1 - 10,000)",
                btn: "🔄 Start Unfollow",
                helpBtnOpen: "❓ How to get Session ID?",
                helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 1. For Android</h4>
                    <p><b>Note:</b> Normal Chrome won't work, download ${lemurLink} from Play Market!<br>1. Log in to Instagram using Lemur Browser.<br>2. Tap the 4-squares icon and select <b>Extensions</b>.<br>3. Install and open <b>Cookie-Editor</b>.<br>4. Find and copy the <b>sessionid</b> row.</p>
                    <h4>🍏 2. For iOS (iPhone)</h4>
                    <p>It is difficult on iPhone. Please use a computer or a friend's Android phone.</p>
                    <h4>💻 3. For Computer</h4>
                    <p>1. Log in to Instagram in Chrome.<br>2. Press <b>F12</b>.<br>3. Go to <b>Application</b> -> <b>Cookies</b>.<br>4. Copy the value of the <b>sessionid</b> row.</p>
                `
            }
        };

        let currentLang = 'uz';
        let helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('txt-btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            
            const helpBtn = document.getElementById('helpBtn');
            helpBtn.innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            
            if (helpOpen) {
                content.style.display = 'block';
                btn.innerText = translations[currentLang].helpBtnClose;
            } else {
                content.style.display = 'none';
                btn.innerText = translations[currentLang].helpBtnOpen;
            }
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value;
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');
            const t = translations[currentLang];

            if (!sessionId) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Session ID ni kiriting!" : (currentLang === 'ru' ? "❌ Введите Session ID!" : "❌ Enter Session ID!");
                return;
            }
            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak." : (currentLang === 'ru' ? "❌ Ошибка! Число от 1 до 10,000." : "❌ Error! Number must be 1 - 10,000.");
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = currentLang === 'uz' ? "⏳ Jarayon boshlandi..." : (currentLang === 'ru' ? "⏳ Процесс начался..." : "⏳ Process started...");

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        count: count 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message;
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Server bilan aloqa yo'q!" : (currentLang === 'ru' ? "❌ Нет связи с сервером!" : "❌ No connection to server!");
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
