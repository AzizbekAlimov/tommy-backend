<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Tepa qism (Tillar) */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            appearance: none;
        }
        
        .lang-select option {
            background: #1e293b;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px;
            margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }

        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:active { transform: scale(0.96); }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Qo'llanma (Help) */
        .help-toggle {
            text-align: center;
            margin-top: 20px;
            color: #818cf8;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .help-content {
            display: none;
            margin-top: 15px;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .help-content h4 {
            color: #fff;
            margin: 15px 0 5px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        
        .help-content a {
            color: #fbbf24;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Nusxalash (Copy) tugmalari dizayni */
        .copy-code {
            display: block;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: #22c55e;
            margin-bottom: 8px;
            cursor: pointer;
            word-break: break-all; /* Uzun havola sig'masa pastga tushadi */
            border: 1px solid #22c55e;
            transition: 0.2s;
            text-align: center;
        }
        .copy-code:active {
            transform: scale(0.98);
            background: #1e293b;
        }

        /* Mualliflik (Footer) */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .footer a:active { color: #3b82f6; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        
        <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
        <input type="number" id="count" min="1" max="10000" value="100">
        
        <button class="btn" onclick="sendData()" id="txt-btn-unfollow">
            🔄 Unfollow Boshlash
        </button>
        <div id="status"></div>

        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        
        <div class="help-content" id="helpContent">
            <div id="help-text"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        // Telegram WebApp ni ishga tushirish
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Termux uchun Play Market havolasi
        const termuxLink = '<a href="https://play.google.com/store/apps/details?id=com.termux" target="_blank">Termux</a>';

        // Tillar lug'ati (Copy tugmalari va havolalar bilan)
        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btn: "🔄 Unfollow Boshlash",
                helpBtnOpen: "❓ Session ID qanday olinadi?",
                helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 ${termuxLink} orqali olish (Android)</h4>
                    <p>1. Play Market'dan ${termuxLink} yuklab oling.<br>
                    2. Termux'ni ochib, quyidagi buyruqlarni ustiga bosib nusxalang (Copy) va Termux'ga yopishtiring (Paste):<br>
                    <span class="copy-code" onclick="copyToClipboard('pkg update -y && pkg install python git -y', this)">pkg update -y && pkg install python git -y</span>
                    <span class="copy-code" onclick="copyToClipboard('git clone https://github.com/DominatorStufs/InstaSnap.git', this)">git clone https://github.com/DominatorStufs/InstaSnap.git</span>
                    <span class="copy-code" onclick="copyToClipboard('cd InstaSnap', this)">cd InstaSnap</span>
                    <span class="copy-code" onclick="copyToClipboard('bash setup.sh', this)">bash setup.sh</span>
                    <span class="copy-code" onclick="copyToClipboard('python cookie_extractor.py', this)">python cookie_extractor.py</span>
                    3. Username va parolingizni kiriting. <i>(Parol yozilganda ekranda ko'rinmaydi, yozib bo'lib Enter bosing)</i>.<br>
                    4. Agar <b>"Security Checkpoint"</b> xatosi chiqsa, rasmiy Instagram ilovasiga kirib <b>"This Was Me"</b> tugmasini bosing va Termux'da qayta urinib ko'ring.<br>
                    5. Session ID terminalda chiqadi. Agar ko'rinmasa, ushbu buyruqni yozing:<br>
                    <span class="copy-code" onclick="copyToClipboard('cat config.py', this)">cat config.py</span></p>
                    <h4>💻 Kompyuter uchun</h4>
                    <p>1. Chrome brauzerida Instagram'ga kiring.<br>2. <b>F12</b> tugmasini bosing.<br>3. <b>Application</b> -> <b>Cookies</b> bo'limiga o'ting.<br>4. <b>sessionid</b> qatoridagi uzun matnni nusxalab oling.</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Сколько отписаться? (1 - 10,000)",
                btn: "🔄 Начать отписку",
                helpBtnOpen: "❓ Как получить Session ID?",
                helpBtnClose: "❌ Закрыть информацию",
                created: "Создатель:",
                help: `
                    <h4>📱 Через ${termuxLink} (Android)</h4>
                    <p>1. Скачайте ${termuxLink} из Play Market.<br>
                    2. Откройте Termux, нажмите на команды ниже чтобы скопировать, и вставьте их:<br>
                    <span class="copy-code" onclick="copyToClipboard('pkg update -y && pkg install python git -y', this)">pkg update -y && pkg install python git -y</span>
                    <span class="copy-code" onclick="copyToClipboard('git clone https://github.com/DominatorStufs/InstaSnap.git', this)">git clone https://github.com/DominatorStufs/InstaSnap.git</span>
                    <span class="copy-code" onclick="copyToClipboard('cd InstaSnap', this)">cd InstaSnap</span>
                    <span class="copy-code" onclick="copyToClipboard('bash setup.sh', this)">bash setup.sh</span>
                    <span class="copy-code" onclick="copyToClipboard('python cookie_extractor.py', this)">python cookie_extractor.py</span>
                    3. Введите логин и пароль. <i>(Пароль не отображается)</i>.<br>
                    4. Если появится ошибка <b>"Security Checkpoint"</b>, нажмите <b>"This Was Me"</b> в приложении Instagram и попробуйте снова.<br>
                    5. Session ID появится в терминале. Если нет, введите:<br>
                    <span class="copy-code" onclick="copyToClipboard('cat config.py', this)">cat config.py</span></p>
                    <h4>💻 Для компьютера</h4>
                    <p>1. Зайдите в Instagram в Chrome.<br>2. Нажмите <b>F12</b>.<br>3. Перейдите в <b>Application</b> -> <b>Cookies</b>.<br>4. Скопируйте значение строки <b>sessionid</b>.</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "How many to unfollow? (1 - 10,000)",
                btn: "🔄 Start Unfollow",
                helpBtnOpen: "❓ How to get Session ID?",
                helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 Via ${termuxLink} (Android)</h4>
                    <p>1. Download ${termuxLink} from Play Market.<br>
                    2. Open Termux, tap the commands below to copy, and paste them:<br>
                    <span class="copy-code" onclick="copyToClipboard('pkg update -y && pkg install python git -y', this)">pkg update -y && pkg install python git -y</span>
                    <span class="copy-code" onclick="copyToClipboard('git clone https://github.com/DominatorStufs/InstaSnap.git', this)">git clone https://github.com/DominatorStufs/InstaSnap.git</span>
                    <span class="copy-code" onclick="copyToClipboard('cd InstaSnap', this)">cd InstaSnap</span>
                    <span class="copy-code" onclick="copyToClipboard('bash setup.sh', this)">bash setup.sh</span>
                    <span class="copy-code" onclick="copyToClipboard('python cookie_extractor.py', this)">python cookie_extractor.py</span>
                    3. Enter username and password. <i>(Password won't show)</i>.<br>
                    4. If <b>"Security Checkpoint"</b> error, tap <b>"This Was Me"</b> in Instagram app and try again.<br>
                    5. Session ID will appear in terminal. If not, type:<br>
                    <span class="copy-code" onclick="copyToClipboard('cat config.py', this)">cat config.py</span></p>
                    <h4>💻 For Computer</h4>
                    <p>1. Log in to Instagram in Chrome.<br>2. Press <b>F12</b>.<br>3. Go to <b>Application</b> -> <b>Cookies</b>.<br>4. Copy the value of the <b>sessionid</b> row.</p>
                `
            }
        };

        let currentLang = 'uz';
        let helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('txt-btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            
            const helpBtn = document.getElementById('helpBtn');
            helpBtn.innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            
            if (helpOpen) {
                content.style.display = 'block';
                btn.innerText = translations[currentLang].helpBtnClose;
            } else {
                content.style.display = 'none';
                btn.innerText = translations[currentLang].helpBtnOpen;
            }
        }

        // Matnni nusxalash (Copy) funksiyasi
        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                // Telegram orqali xabar ko'rsatish
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.showAlert("✅ Nusxalandi! Endi Termux'ga yopishtiring.");
                } else {
                    alert("✅ Nusxalandi!");
                }

                // Vizual effekt (yashil rangga o'tadi)
                const originalText = element.innerText;
                element.innerText = "✅ Nusxalandi!";
                element.style.backgroundColor = "#22c55e";
                element.style.color = "#fff";
                
                setTimeout(() => {
                    element.innerText = originalText;
                    element.style.backgroundColor = "#000";
                    element.style.color = "#22c55e";
                }, 1500);
            }).catch(err => {
                alert("Xatolik: Matnni nusxalab bo'lmadi.");
            });
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value;
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');
            const t = translations[currentLang];

            if (!sessionId) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Session ID ni kiriting!" : (currentLang === 'ru' ? "❌ Введите Session ID!" : "❌ Enter Session ID!");
                return;
            }
            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak." : (currentLang === 'ru' ? "❌ Ошибка! Число от 1 до 10,000." : "❌ Error! Number must be 1 - 10,000.");
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = currentLang === 'uz' ? "⏳ Jarayon boshlandi..." : (currentLang === 'ru' ? "⏳ Процесс начался..." : "⏳ Process started...");

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        count: count 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message;
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Server bilan aloqa yo'q!" : (currentLang === 'ru' ? "❌ Нет связи с сервером!" : "❌ No connection to server!");
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
