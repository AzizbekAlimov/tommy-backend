<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1; --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column;
            box-sizing: border-box; overflow-x: hidden;
        }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-select {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 10px; font-size: 14px; outline: none;
            cursor: pointer; backdrop-filter: blur(10px); -webkit-appearance: none;
        }
        .lang-select option { background: #1e293b; color: white; }
        .header { text-align: center; margin-bottom: 30px; }
        .icon-circle {
            width: 110px; height: 110px; border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 15px; border-radius: 14px; margin-bottom: 18px;
            box-sizing: border-box; outline: none; font-size: 15px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }
        .btn {
            width: 100%; background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white; border: none; padding: 16px; border-radius: 14px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4); transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; line-height: 1.4; }
        .help-toggle { text-align: center; margin-top: 20px; color: #818cf8; font-size: 14px; cursor: pointer; font-weight: 600; }
        .help-content {
            display: none; margin-top: 15px; background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border); border-radius: 14px; padding: 15px;
            font-size: 13px; line-height: 1.6; color: #cbd5e1;
        }
        .help-content h4 { color: #fff; margin: 15px 0 5px 0; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        .help-content a { color: #fbbf24; text-decoration: underline; font-weight: bold; }
        .copy-btn {
            display: block; width: 100%; background: #000; padding: 12px;
            border-radius: 8px; font-family: monospace; color: #22c55e;
            margin: 10px 0; cursor: pointer; border: 1px solid #22c55e;
            text-align: center; font-size: 14px; font-weight: bold; transition: 0.2s; box-sizing: border-box;
        }
        .copy-btn:active { transform: scale(0.98); background: #1e293b; }
        .footer { text-align: center; margin-top: auto; padding-top: 20px; font-size: 14px; color: var(--text-muted); }
        .footer a { color: #60a5fa; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>
    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>
    <div class="card">
        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
        <input type="number" id="count" min="1" max="10000" value="100">
        <button class="btn" onclick="sendData()" id="btn-unfollow">🔄 Unfollow Boshlash</button>
        <div id="status"></div>
        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        <div class="help-content" id="helpContent"><div id="help-text"></div></div>
    </div>
    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        const termuxLink = '<a href="https://play.google.com/store/apps/details?id=com.termux" target="_blank">Termux</a>';
        const currentHost = window.location.origin;

        const translations = {
            uz: {
                title: "INSTAGRAM BOT", subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)", labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btn: "🔄 Unfollow Boshlash", helpBtnOpen: "❓ Session ID qanday olinadi?", helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 ${termuxLink} orqali olish (Oson usul)</h4>
                    <p><b>1-qadam:</b> Play Market'dan ${termuxLink} yuklab oling.<br>
                    <b>2-qadam:</b> Kutubxonani yangilash:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <b>3-qadam:</b> Dastur kodini yuklash:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Kodni Yuklash (Copy)</button>
                    <b>4-qadam:</b> Dasturni ishga tushirish:<br>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button>
                    <b>5-qadam:</b> Parol va 2FA kodini kiritib, chiqqan Session ID'ni nusxalang va joylashtiring.</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT", subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)", labelCount: "Сколько отписаться? (1 - 10,000)",
                btn: "🔄 Начать отписку", helpBtnOpen: "❓ Как получить Session ID?", helpBtnClose: "❌ Закрыть",
                created: "Создатель:",
                help: `
                    <h4>📱 Через ${termuxLink}</h4>
                    <p><b>Шаг 1:</b> Скачайте ${termuxLink}.<br>
                    <b>Шаг 2:</b> Обновите библиотеку:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <b>Шаг 3:</b> Скачайте скрипт:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Скачать скрипт (Copy)</button>
                    <b>Шаг 4:</b> Запустите скрипт:<br>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button>
                    <b>Шаг 5:</b> Введите логин, пароль и 2FA. Скопируйте Session ID.</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT", subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)", labelCount: "How many to unfollow? (1 - 10,000)",
                btn: "🔄 Start Unfollow", helpBtnOpen: "❓ How to get Session ID?", helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 Via ${termuxLink}</h4>
                    <p><b>Step 1:</b> Download ${termuxLink}.<br>
                    <b>Step 2:</b> Install the library:<br>
                    <button class="copy-btn" onclick="copyText('pip install -U instagrapi', this)">📋 pip install -U instagrapi</button>
                    <b>Step 3:</b> Download the script:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyText('curl -s -o get_id.py ${currentHost}/get_id.py', this)">📋 Download Script (Copy)</button>
                    <b>Step 4:</b> Run the script:<br>
                    <button class="copy-btn" onclick="copyText('python get_id.py', this)">📋 python get_id.py</button>
                    <b>Step 5:</b> Enter username, password, and 2FA. Copy the Session ID.</p>
                `
            }
        };

        let currentLang = 'uz', helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            document.getElementById('helpBtn').innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            content.style.display = helpOpen ? 'block' : 'none';
            btn.innerText = helpOpen ? translations[currentLang].helpBtnClose : translations[currentLang].helpBtnOpen;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                if (window.Telegram) window.Telegram.WebApp.showAlert("✅ Nusxalandi!");
                else alert("✅ Nusxalandi!");
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Nusxalandi!";
                btn.style.backgroundColor = "#22c55e"; btn.style.color = "#fff";
                setTimeout(() => { 
                    btn.innerHTML = originalText; 
                    btn.style.backgroundColor = "#000"; 
                    btn.style.color = originalText.includes("Yuklash") || originalText.includes("Скачать") || originalText.includes("Download") ? "#60a5fa" : "#22c55e";
                }, 1500);
            });
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btn-unfollow');

            if (!sessionId || sessionId.length < 20) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "❌ Session ID ni to'g'ri kiriting!";
                return;
            }
            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ Tekshirilmoqda...";
            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = "⏳ Session ID tekshirilmoqda va jarayon boshlanmoqda...";

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, count: count })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message + " (Obunachilar sekin-asta o'chadi, bu 50 daqiqagacha vaqt olishi mumkin)";
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ Xatolik: " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = "❌ Server bilan aloqa yo'q! (Render uxlagan bo'lishi mumkin)";
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = translations[currentLang].btn;
                }, 5000);
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
