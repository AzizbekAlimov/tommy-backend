<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column;
            box-sizing: border-box; overflow-x: hidden;
        }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .lang-select {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 10px; font-size: 14px; outline: none;
            cursor: pointer; backdrop-filter: blur(10px); -webkit-appearance: none;
        }
        .lang-select option { background: #1e293b; color: white; }
        .header { text-align: center; margin-bottom: 30px; }
        .icon-circle {
            width: 110px; height: 110px; border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 15px; border-radius: 14px; margin-bottom: 18px;
            box-sizing: border-box; outline: none; font-size: 15px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }
        .btn {
            width: 100%; background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white; border: none; padding: 16px; border-radius: 14px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:active { transform: scale(0.96); }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
        .help-toggle { text-align: center; margin-top: 20px; color: #818cf8; font-size: 14px; cursor: pointer; font-weight: 600; }
        .help-content {
            display: none; margin-top: 15px; background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border); border-radius: 14px; padding: 15px;
            font-size: 13px; line-height: 1.6; color: #cbd5e1;
        }
        .help-content h4 { color: #fff; margin: 15px 0 5px 0; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        .help-content a { color: #fbbf24; text-decoration: underline; font-weight: bold; }
        
        /* Copy Button Style */
        .copy-btn {
            display: block; width: 100%; background: #000; padding: 12px;
            border-radius: 8px; font-family: monospace; color: #22c55e;
            margin: 10px 0; cursor: pointer; border: 1px solid #22c55e;
            text-align: center; font-size: 14px; font-weight: bold;
            transition: 0.2s; box-sizing: border-box;
        }
        .copy-btn:active { transform: scale(0.98); background: #1e293b; }
        
        .footer { text-align: center; margin-top: auto; padding-top: 20px; font-size: 14px; color: var(--text-muted); }
        .footer a { color: #60a5fa; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        
        <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
        <input type="number" id="count" min="1" max="10000" value="100">
        
        <button class="btn" onclick="sendData()" id="txt-btn-unfollow">
            🔄 Unfollow Boshlash
        </button>
        <div id="status"></div>

        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        
        <div class="help-content" id="helpContent">
            <div id="help-text"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const termuxLink = '<a href="https://play.google.com/store/apps/details?id=com.termux" target="_blank">Termux</a>';

        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btn: "🔄 Unfollow Boshlash",
                helpBtnOpen: "❓ Session ID qanday olinadi?",
                helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 ${termuxLink} orqali olish</h4>
                    <p><b>1-qadam:</b> Play Market'dan ${termuxLink} yuklab oling.<br>
                    <b>2-qadam:</b> Kutubxonani o'rnatish uchun quyidagini nusxalab, Termux'ga yopishtiring va <b>Enter</b> bosing:<br>
                    <button class="copy-btn" onclick="copyCommand('pip install instagrapi', this)">📋 pip install instagrapi</button>
                    
                    <b>3-qadam:</b> Dastur kodini avtomatik yaratish uchun pastdagi tugmani bosing:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyPythonCode(this)">📋 Kodni Yaratish (Copy)</button>
                    Termux'ga yopishtiring (Paste) va <b>Enter</b> bosing. Fayl avtomatik yaratiladi.<br>
                    
                    <b>4-qadam:</b> Endi dasturni ishga tushirish uchun shu buyruqni bosing:<br>
                    <button class="copy-btn" onclick="copyCommand('python get_id.py', this)">📋 python get_id.py</button>
                    Termux'ga yopishtirib <b>Enter</b> bosing.<br>

                    <b>5-qadam:</b> Username, Parol va 2FA kodini kiriting. Ekranda chiqqan uzun <b>Session ID</b> ni nusxalab, botga qo'ying.</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Сколько отписаться? (1 - 10,000)",
                btn: "🔄 Начать отписку",
                helpBtnOpen: "❓ Как получить Session ID?",
                helpBtnClose: "❌ Закрыть информацию",
                created: "Создатель:",
                help: `
                    <h4>📱 Через ${termuxLink}</h4>
                    <p><b>Шаг 1:</b> Скачайте ${termuxLink}.<br>
                    <b>Шаг 2:</b> Установите библиотеку:<br>
                    <button class="copy-btn" onclick="copyCommand('pip install instagrapi', this)">📋 pip install instagrapi</button>
                    
                    <b>Шаг 3:</b> Скопируйте код для автосоздания файла:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyPythonCode(this)">📋 Создать код (Copy)</button>
                    Вставьте в Termux и нажмите <b>Enter</b>.<br>
                    
                    <b>Шаг 4:</b> Запустите скрипт:<br>
                    <button class="copy-btn" onclick="copyCommand('python get_id.py', this)">📋 python get_id.py</button>
                    Вставьте и нажмите <b>Enter</b>.<br>

                    <b>Шаг 5:</b> Введите логин, пароль и 2FA. Скопируйте ваш <b>Session ID</b> и вставьте в бота.</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "How many to unfollow? (1 - 10,000)",
                btn: "🔄 Start Unfollow",
                helpBtnOpen: "❓ How to get Session ID?",
                helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 Via ${termuxLink}</h4>
                    <p><b>Step 1:</b> Download ${termuxLink}.<br>
                    <b>Step 2:</b> Install the library:<br>
                    <button class="copy-btn" onclick="copyCommand('pip install instagrapi', this)">📋 pip install instagrapi</button>
                    
                    <b>Step 3:</b> Copy the code to create the file automatically:<br>
                    <button class="copy-btn" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyPythonCode(this)">📋 Copy Auto-Create Code</button>
                    Paste it into Termux and press <b>Enter</b>.<br>
                    
                    <b>Step 4:</b> Run the script:<br>
                    <button class="copy-btn" onclick="copyCommand('python get_id.py', this)">📋 python get_id.py</button>
                    Paste and press <b>Enter</b>.<br>

                    <b>Step 5:</b> Enter username, password, and 2FA code. Copy the <b>Session ID</b> and paste it into the bot.</p>
                `
            }
        };

        let currentLang = 'uz';
        let helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('txt-btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            
            const helpBtn = document.getElementById('helpBtn');
            helpBtn.innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            
            if (helpOpen) {
                content.style.display = 'block';
                btn.innerText = translations[currentLang].helpBtnClose;
            } else {
                content.style.display = 'none';
                btn.innerText = translations[currentLang].helpBtnOpen;
            }
        }

        // Oddiy buyruqlarni nusxalash (pip install ...)
        function copyCommand(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                if (window.Telegram) window.Telegram.WebApp.showAlert("✅ Nusxalandi! Termux'ga yopishtiring.");
                else alert("✅ Nusxalandi!");
                
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Nusxalandi!";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "#fff";
                setTimeout(() => { btn.innerHTML = originalText; btn.style.backgroundColor = "#000"; btn.style.color = "#22c55e"; }, 1500);
            });
        }

        // Python kodini yaratish buyrug'ini nusxalash
        function copyPythonCode(btn) {
            // \` va ' belgilarini chalkashmasligi uchun JS ichida to'g'ridan-to'g'ri yozamiz
            const pythonScript = [
                "cat << 'EOF' > get_id.py",
                "from instagrapi import Client",
                "print('\\n--- Instagram Session ID Olish ---')",
                "u = input('Username: ')",
                "p = input('Parol: ')",
                "c = Client()",
                "try:",
                "    c.login(u, p)",
                "except Exception as e:",
                "    if 'two_factor' in str(e).lower():",
                "        code = input('2FA kod: ')",
                "        try:",
                "            c.login(u, p, verification_code=code)",
                "        except Exception as e2:",
                "            print('Xatolik:', e2)",
                "            exit()",
                "    else:",
                "        print('Xatolik:', e)",
                "        exit()",
                "print('\\n✅ Muvaffaqiyatli kirdingiz!')",
                "print('Sizning Session ID:')",
                "print(c.sessionid)",
                "print('\\n')",
                "EOF"
            ].join('\n');

            navigator.clipboard.writeText(pythonScript).then(() => {
                if (window.Telegram) window.Telegram.WebApp.showAlert("✅ Kod nusxalandi! Termux'ga yopishtiring.");
                else alert("✅ Kod nusxalandi!");
                
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Nusxalandi!";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "#fff";
                setTimeout(() => { btn.innerHTML = originalText; btn.style.backgroundColor = "#000"; btn.style.color = "#60a5fa"; }, 1500);
            });
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value;
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');

            if (!sessionId) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Session ID ni kiriting!" : "❌ Enter Session ID!";
                return;
            }
            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak." : "❌ Error! Number must be 1 - 10,000.";
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = currentLang === 'uz' ? "⏳ Jarayon boshlandi..." : "⏳ Process started...";

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, count: count })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message;
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Server bilan aloqa yo'q!" : "❌ No connection to server!";
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
