<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            appearance: none;
        }
        
        .lang-select option {
            background: #1e293b;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px;
            margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }

        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Mualliflik (Footer) */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .footer a:active { color: #3b82f6; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <!-- 1-BOSQICH: KIRISH -->
        <div id="step-login">
            <label id="txt-label-user">Instagram Username</label>
            <input type="text" id="username" placeholder="@username...">
            
            <label id="txt-label-pass">Instagram Parol</label>
            <input type="password" id="password" placeholder="Parol...">
            
            <button class="btn" onclick="loginInstagram()" id="btn-login">
                🔐 KIRISH
            </button>
            <div id="login-status" style="text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
        </div>

        <!-- 2-BOSQICH: UNFOLLOW (Boshida yashirin) -->
        <div id="step-action" class="hidden">
            <p id="success-msg" style="color: #22c55e; text-align: center; margin-bottom: 20px; font-weight: bold;">
                ✅ Akkauntga muvaffaqiyatli kirdingiz!
            </p>
            
            <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
            <input type="number" id="count" min="1" max="10000" value="100">
            
            <button class="btn" onclick="startUnfollow()" id="btn-unfollow">
                🔄 UNFOLLOW BOSHLASH
            </button>
            <div id="action-status" style="text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Tarjimalar
        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelUser: "Instagram Username",
                labelPass: "Instagram Parol",
                btnLogin: "🔐 KIRISH",
                labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btnUnfollow: "🔄 UNFOLLOW BOSHLASH",
                created: "Yaratuvchi:",
                success: "✅ Akkauntga muvaffaqiyatli kirdingiz!",
                errorLogin: "❌ Username yoki parol xato!",
                errorServer: "❌ Server bilan aloqa yo'q!",
                errorCount: "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak.",
                processStarted: "⏳ Jarayon boshlandi..."
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelUser: "Instagram Username",
                labelPass: "Instagram Пароль",
                btnLogin: "🔐 ВОЙТИ",
                labelCount: "Сколько отписаться? (1 - 10,000)",
                btnUnfollow: "🔄 НАЧАТЬ ОТПИСКУ",
                created: "Создатель:",
                success: "✅ Успешный вход в аккаунт!",
                errorLogin: "❌ Неверный логин или пароль!",
                errorServer: "❌ Нет связи с сервером!",
                errorCount: "❌ Ошибка! Число от 1 до 10,000.",
                processStarted: "⏳ Процесс начался..."
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelUser: "Instagram Username",
                labelPass: "Instagram Password",
                btnLogin: "🔐 LOGIN",
                labelCount: "How many to unfollow? (1 - 10,000)",
                btnUnfollow: "🔄 START UNFOLLOW",
                created: "Created by:",
                success: "✅ Successfully logged into account!",
                errorLogin: "❌ Incorrect username or password!",
                errorServer: "❌ No connection to server!",
                errorCount: "❌ Error! Number must be 1 - 10,000.",
                processStarted: "⏳ Process started..."
            }
        };

        let currentLang = 'uz';
        // Backenddan keladigan sessiyani saqlash uchun
        let currentSessionId = ""; 

        // Tilni o'zgartirish
        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-user').innerText = t.labelUser;
            document.getElementById('txt-label-pass').innerText = t.labelPass;
            document.getElementById('btn-login').innerText = t.btnLogin;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('btn-unfollow').innerText = t.btnUnfollow;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('success-msg').innerText = t.success;
        }

        // 1-QADAM: Instagramga kirish
        async function loginInstagram() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');
            const t = translations[currentLang];

            if (!username || !password) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = t.errorLogin;
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = "⏳...";

            try {
                // Backendga login so'rovi yuboramiz
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        password: password 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    // Agar muvaffaqiyatli bo'lsa, sessiyani saqlaymiz
                    currentSessionId = result.session_id; 
                    
                    // 1-bo'limni yashiramiz, 2-bo'limni ochamiz
                    document.getElementById('step-login').classList.add('hidden');
                    document.getElementById('step-action').classList.remove('hidden');
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = result.detail || t.errorLogin;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = t.errorServer;
            }
        }

        // 2-QADAM: Unfollow boshlash
        async function startUnfollow() {
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('action-status');
            const t = translations[currentLang];

            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = t.errorCount;
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = t.processStarted;

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: currentSessionId, // Login qilganda olingan sessiya
                        count: count 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message;
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = t.errorServer;
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
