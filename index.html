<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Bot</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000000);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Tepa qism (Tillar) */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-appearance: none;
            appearance: none;
        }
        
        .lang-select option {
            background: #1e293b;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .icon-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            display: flex; justify-content: center; align-items: center;
            font-size: 45px;
            margin: 0 auto 15px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        }

        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;}
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:active { transform: scale(0.96); }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Qo'llanma (Help) */
        .help-toggle {
            text-align: center;
            margin-top: 20px;
            color: #818cf8;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .help-content {
            display: none;
            margin-top: 15px;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .help-content h4 {
            color: #fff;
            margin: 15px 0 5px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .help-content h4:first-child { margin-top: 0; }
        .help-content b { color: #fbbf24; }
        
        .help-content a {
            color: #fbbf24;
            text-decoration: underline;
            font-weight: bold;
        }

        /* Nusxalash (Copy) tugmalari dizayni */
        .copy-code {
            display: block;
            background: #000;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            color: #22c55e;
            margin: 10px 0;
            cursor: pointer;
            word-break: break-all;
            border: 1px solid #22c55e;
            transition: 0.2s;
            text-align: center;
            font-size: 14px;
        }
        .copy-code:active {
            transform: scale(0.98);
            background: #1e293b;
        }

        /* Mualliflik (Footer) */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .footer a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .footer a:active { color: #3b82f6; }
    </style>
</head>
<body>

    <div class="top-bar">
        <select class="lang-select" id="langSwitcher" onchange="changeLanguage(this.value)">
            <option value="uz">🇺🇿 UZ</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="en">🇬🇧 EN</option>
        </select>
    </div>

    <div class="header">
        <div class="icon-circle">📸</div>
        <h1 id="txt-title">INSTAGRAM BOT</h1>
        <p class="subtitle" id="txt-subtitle">Obunachilarni avtomatik tozalash</p>
    </div>

    <div class="card">
        <label id="txt-label-session">Instagram Session ID (cookie)</label>
        <input type="password" id="sessionid" placeholder="Session ID...">
        
        <label id="txt-label-count">Nechta odamni unfollow qilish? (1 - 10,000)</label>
        <input type="number" id="count" min="1" max="10000" value="100">
        
        <button class="btn" onclick="sendData()" id="txt-btn-unfollow">
            🔄 Unfollow Boshlash
        </button>
        <div id="status"></div>

        <div class="help-toggle" id="helpBtn" onclick="toggleHelp()">❓ Session ID qanday olinadi?</div>
        
        <div class="help-content" id="helpContent">
            <div id="help-text"></div>
        </div>
    </div>

    <div class="footer">
        <span id="txt-created">Yaratuvchi:</span> 
        <a href="https://t.me/Tommy_1727" target="_blank">@Tommy_1727</a>
    </div>

    <script>
        // Telegram WebApp ni ishga tushirish
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Termux uchun Play Market havolasi
        const termuxLink = '<a href="https://play.google.com/store/apps/details?id=com.termux" target="_blank">Termux</a>';

        // To'liq Python kodi (nusxalash uchun)
        const pythonCode = `from instagrapi import Client

print("\\n--- Instagram Session ID Olish ---")
username = input("Username: ")
password = input("Parol: ")

cl = Client()

try:
    cl.login(username, password)
except Exception as e:
    if "two_factor" in str(e).lower() or "challenge" in str(e).lower():
        code = input("2FA kodini kiriting (SMS yoki Authenticator): ")
        try:
            cl.login(username, password, verification_code=code)
        except Exception as e2:
            print(f"\\n❌ Xatolik: {e2}")
            exit()
    else:
        print(f"\\n❌ Kirishda xatolik: {e}")
        exit()

print("\\n✅ Muvaffaqiyatli kirdingiz!")
print("Sizning Session ID'ingiz (nusxalab oling):")
print("\\n" + cl.sessionid + "\\n")`;

        // Tillar lug'ati (To'liq Termux qo'llanmasi bilan)
        const translations = {
            uz: {
                title: "INSTAGRAM BOT",
                subtitle: "Obunachilarni avtomatik tozalash",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Nechta odamni unfollow qilish? (1 - 10,000)",
                btn: "🔄 Unfollow Boshlash",
                helpBtnOpen: "❓ Session ID qanday olinadi?",
                helpBtnClose: "❌ Ma'lumotni yopish",
                created: "Yaratuvchi:",
                help: `
                    <h4>📱 ${termuxLink} orqali olish (Android)</h4>
                    <p><b>1-qadam:</b> Play Market'dan ${termuxLink} yuklab oling va oching.<br>
                    <b>2-qadam:</b> Kerakli kutubxonani o'rnatish uchun quyidagi yozuvni ustiga bosib nusxalang va Termux'ga yopishtirib (Paste) Enter bosing:<br>
                    <span class="copy-code" onclick="copyToClipboard('pip install instagrapi', this)">📋 pip install instagrapi</span>
                    
                    <b>3-qadam:</b> Yangi fayl yaratish uchun shu buyruqni nusxalab, Termux'ga yozing va Enter bosing:<br>
                    <span class="copy-code" onclick="copyToClipboard('nano get_id.py', this)">📋 nano get_id.py</span>
                    
                    <b>4-qadam:</b> Ochilgan qora ekranga quyidagi Python kodini nusxalab joylashtiring:<br>
                    <span class="copy-code" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyToClipboard(\`${pythonCode}\`, this)">📋 Python Kodini Nusxalash (Copy)</span>
                    
                    <b>5-qadam:</b> Kodni qo'yib bo'lgach, klaviaturangizdagi <b>CTRL</b> ni bosib turib <b>O</b> harfini bosing (Saqlash), so'ngra <b>Enter</b> bosing. Chiqish uchun yana <b>CTRL</b> ni bosib turib <b>X</b> harfini bosing.
                    
                    <b>6-qadam:</b> Dasturni ishga tushirish uchun shu buyruqni bering:<br>
                    <span class="copy-code" onclick="copyToClipboard('python get_id.py', this)">📋 python get_id.py</span>
                    
                    <b>7-qadam:</b> Dastur sizdan Username, Parol va agar yoqilgan bo'lsa 2FA kodini so'raydi. (Parol yozilganda ekranda ko'rinmaydi).<br>
                    <b>8-qadam:</b> Dastur oxirida sizga uzun <b>Session ID</b> ni chiqaradi. Uni nusxalab, botning eng tepasidagi joyga qo'ying.</p>
                `
            },
            ru: {
                title: "INSTAGRAM BOT",
                subtitle: "Автоматическая очистка подписок",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "Сколько отписаться? (1 - 10,000)",
                btn: "🔄 Начать отписку",
                helpBtnOpen: "❓ Как получить Session ID?",
                helpBtnClose: "❌ Закрыть информацию",
                created: "Создатель:",
                help: `
                    <h4>📱 Через ${termuxLink} (Android)</h4>
                    <p><b>Шаг 1:</b> Скачайте ${termuxLink} из Play Market и откройте.<br>
                    <b>Шаг 2:</b> Нажмите на команду ниже, чтобы скопировать, и вставьте в Termux:<br>
                    <span class="copy-code" onclick="copyToClipboard('pip install instagrapi', this)">📋 pip install instagrapi</span>
                    
                    <b>Шаг 3:</b> Создайте файл:<br>
                    <span class="copy-code" onclick="copyToClipboard('nano get_id.py', this)">📋 nano get_id.py</span>
                    
                    <b>Шаг 4:</b> Вставьте этот код Python в открывшееся окно:<br>
                    <span class="copy-code" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyToClipboard(\`${pythonCode}\`, this)">📋 Скопировать код Python</span>
                    
                    <b>Шаг 5:</b> Нажмите <b>CTRL + O</b> (Сохранить), затем <b>Enter</b>. Выйдите через <b>CTRL + X</b>.
                    
                    <b>Шаг 6:</b> Запустите скрипт:<br>
                    <span class="copy-code" onclick="copyToClipboard('python get_id.py', this)">📋 python get_id.py</span>
                    
                    <b>Шаг 7:</b> Введите логин, пароль и код 2FA.<br>
                    <b>Шаг 8:</b> Скопируйте ваш <b>Session ID</b> и вставьте в бота.</p>
                `
            },
            en: {
                title: "INSTAGRAM BOT",
                subtitle: "Automatic follower cleanup",
                labelSession: "Instagram Session ID (cookie)",
                labelCount: "How many to unfollow? (1 - 10,000)",
                btn: "🔄 Start Unfollow",
                helpBtnOpen: "❓ How to get Session ID?",
                helpBtnClose: "❌ Close info",
                created: "Created by:",
                help: `
                    <h4>📱 Via ${termuxLink} (Android)</h4>
                    <p><b>Step 1:</b> Download ${termuxLink} from Play Market and open it.<br>
                    <b>Step 2:</b> Tap the command to copy and paste it into Termux:<br>
                    <span class="copy-code" onclick="copyToClipboard('pip install instagrapi', this)">📋 pip install instagrapi</span>
                    
                    <b>Step 3:</b> Create a file:<br>
                    <span class="copy-code" onclick="copyToClipboard('nano get_id.py', this)">📋 nano get_id.py</span>
                    
                    <b>Step 4:</b> Paste this python code:<br>
                    <span class="copy-code" style="color: #60a5fa; border-color: #60a5fa;" onclick="copyToClipboard(\`${pythonCode}\`, this)">📋 Copy Python Code</span>
                    
                    <b>Step 5:</b> Press <b>CTRL + O</b> (Save) and <b>Enter</b>. Exit with <b>CTRL + X</b>.
                    
                    <b>Step 6:</b> Run the script:<br>
                    <span class="copy-code" onclick="copyToClipboard('python get_id.py', this)">📋 python get_id.py</span>
                    
                    <b>Step 7:</b> Enter username, password, and 2FA code.<br>
                    <b>Step 8:</b> Copy the <b>Session ID</b> and paste it into the bot.</p>
                `
            }
        };

        let currentLang = 'uz';
        let helpOpen = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-label-session').innerText = t.labelSession;
            document.getElementById('txt-label-count').innerText = t.labelCount;
            document.getElementById('txt-btn-unfollow').innerText = t.btn;
            document.getElementById('txt-created').innerText = t.created;
            document.getElementById('help-text').innerHTML = t.help;
            
            const helpBtn = document.getElementById('helpBtn');
            helpBtn.innerText = helpOpen ? t.helpBtnClose : t.helpBtnOpen;
        }

        function toggleHelp() {
            const content = document.getElementById('helpContent');
            const btn = document.getElementById('helpBtn');
            helpOpen = !helpOpen;
            
            if (helpOpen) {
                content.style.display = 'block';
                btn.innerText = translations[currentLang].helpBtnClose;
            } else {
                content.style.display = 'none';
                btn.innerText = translations[currentLang].helpBtnOpen;
            }
        }

        // Matnni nusxalash (Copy) funksiyasi
        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.showAlert("✅ Nusxalandi! Endi Termux'ga yopishtiring.");
                } else {
                    alert("✅ Nusxalandi!");
                }

                const originalText = element.innerText;
                element.innerText = "✅ Nusxalandi!";
                element.style.backgroundColor = "#22c55e";
                element.style.color = "#fff";
                
                setTimeout(() => {
                    element.innerText = originalText;
                    element.style.backgroundColor = "#000";
                    if(originalText.includes("Python")) {
                         element.style.color = "#60a5fa";
                    } else {
                         element.style.color = "#22c55e";
                    }
                }, 1500);
            }).catch(err => {
                alert("Xatolik: Matnni nusxalab bo'lmadi.");
            });
        }

        async function sendData() {
            const sessionId = document.getElementById('sessionid').value;
            const count = parseInt(document.getElementById('count').value);
            const statusDiv = document.getElementById('status');
            const t = translations[currentLang];

            if (!sessionId) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Session ID ni kiriting!" : (currentLang === 'ru' ? "❌ Введите Session ID!" : "❌ Enter Session ID!");
                return;
            }
            if (count < 1 || count > 10000) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Xato! Son 1 dan 10,000 gacha bo'lishi kerak." : (currentLang === 'ru' ? "❌ Ошибка! Число от 1 до 10,000." : "❌ Error! Number must be 1 - 10,000.");
                return;
            }

            statusDiv.style.color = "#f59e0b";
            statusDiv.innerText = currentLang === 'uz' ? "⏳ Jarayon boshlandi..." : (currentLang === 'ru' ? "⏳ Процесс начался..." : "⏳ Process started...");

            try {
                const response = await fetch('/api/unfollow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        count: count 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "#22c55e";
                    statusDiv.innerText = "✅ " + result.message;
                } else {
                    statusDiv.style.color = "#ef4444";
                    statusDiv.innerText = "❌ " + result.detail;
                }
            } catch (error) {
                statusDiv.style.color = "#ef4444";
                statusDiv.innerText = currentLang === 'uz' ? "❌ Server bilan aloqa yo'q!" : (currentLang === 'ru' ? "❌ Нет связи с сервером!" : "❌ No connection to server!");
            }
        }
        
        changeLanguage('uz');
    </script>
</body>
</html>
